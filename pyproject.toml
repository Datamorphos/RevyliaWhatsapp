[project]
name = "revylia-whatsapp-multiagent-v2"
version = "0.2.0"
description = "Revylia multi-agent WhatsApp gateway with LangGraph and Supabase PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128,<1",
    "httpx>=0.28,<1",
    "pydantic==2.13.4",
    "pydantic-settings>=2.11,<3",
    "langgraph==1.2.9",
    "langgraph-checkpoint-postgres>=3.0.5,<4",
    "langchain==1.3.14",
    "langchain-google-genai==4.2.7",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "langfuse==4.14.1",
]

[project.optional-dependencies]
dev = [
    "uvicorn[standard]>=0.34,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[tool.vercel]
entrypoint = "src.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
